
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Leave Management System</h1>

        <section id="registration-section" class="form-section">
            <h2>Create User</h2>
            <form id="registration-form">
                <label for="username">Username</label>
                <input type="text" id="username" required>

                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" required>

                <label for="roll-number">Roll Number</label>
                <input type="text" id="roll-number" required>

                <label for="casual-leave">Initial Casual Leave</label>
                <input type="number" id="casual-leave" value="10" min="0" required>

                <label for="medical-leave">Initial Medical Leave</label>
                <input type="number" id="medical-leave" value="10" min="0" required>

                <button type="submit" class="btn">Register</button>
            </form>
            <div id="registration-response"></div>
            <p>Already registered?
                <button type="button" id="show-login" class="link-btn">Login</button>
            </p>
        </section>

        <section id="login-section" class="form-section" style="display:none">
            <h2>Login</h2>
            <form id="login-form">
                <label for="email">Email</label>
                <input type="email" id="email" required>
                <button type="submit" class="btn">Login</button>
            </form>
            <p>New user?
                <button type="button" id="show-registration" class="link-btn">Create User</button>
            </p>
        </section>

        <section id="balance-section" style="display:none">
            <h2>Leave Balance</h2>
            <p>Welcome, <span id="username-display"></span></p>
            <p>Roll Number: <span id="roll-number-display"></span></p>
            <p>Casual Leave: <span id="casual-leave-display">0</span></p>
            <p>Medical Leave: <span id="medical-leave-display">0</span></p>
            <button type="button" id="refresh-balance" class="btn">Refresh Balance</button>
            <button type="button" id="logout-button" class="btn">Logout</button>
        </section>

        <section id="apply-leave-section" style="display:none">
            <h2>Apply for Leave</h2>
            <form id="leave-form">
                <label for="leave-type">Leave Type</label>
                <select id="leave-type">
                    <option value="casual">Casual Leave</option>
                    <option value="medical">Medical Leave</option>
                </select>

                <label for="leave-days">Number of Days</label>
                <input type="number" id="leave-days" min="1" required>

                <button type="submit" class="btn">Apply Leave</button>
            </form>
        </section>

        <p id="response-message"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
